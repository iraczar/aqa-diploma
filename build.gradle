plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'ru.netology'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.codeborne:selenide:7.2.3'
    testImplementation 'io.qameta.allure:allure-selenide:2.25.0'

    testImplementation 'commons-dbutils:commons-dbutils:1.8.1'
    testRuntimeOnly 'com.mysql:mysql-connector-j:8.3.0'
    testRuntimeOnly 'org.postgresql:postgresql:42.7.3'
}

test {
    useJUnitPlatform()

    systemProperty 'db.url', System.getProperty('db.url', 'jdbc:mysql://localhost:3306/app')
    systemProperty 'db.user', System.getProperty('db.user', 'app')
    systemProperty 'db.password', System.getProperty('db.password', 'pass')
    systemProperty 'sut.url', System.getProperty('sut.url', 'http://localhost:8080')
    systemProperty 'headless', System.getProperty('headless', 'false')
    systemProperty 'file.encoding', 'UTF-8'

    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}